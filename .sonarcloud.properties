# SonarCloud automatic analysis settings.
#
# Test code is excluded from the duplication metric only (it is still analysed for bugs and
# vulnerabilities): tests repeat their setup on purpose so each one reads on its own. The same
# paths are test code for DeepSource (.deepsource.toml, test_patterns).
sonar.cpd.exclusions=**/tests/**,**/*.test.js,**/*.test.jsx
