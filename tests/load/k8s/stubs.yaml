apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadtest-stubs
spec:
  replicas: 1
  selector:
    matchLabels: { app: loadtest-stubs }
  template:
    metadata:
      labels: { app: loadtest-stubs }
    spec:
      # The stubs need no Kubernetes API access.
      automountServiceAccountToken: false
      # Example (k3s01): pin to the node the iHub under test runs on, so no network hop
      # between them varies; requests keep their CPU apart. Optional.
      # nodeSelector:
      #   kubernetes.io/hostname: k3s01-agent-01
      containers:
        - name: stubs
          image: ihub-loadtest
          args: ['stub/server.mjs']
          ports:
            - { name: llm, containerPort: 8979 }
            - { name: site, containerPort: 8980 }
          env:
            - { name: STUB_TTFT_MS, value: '700' }
            - { name: STUB_TOKENS, value: '250' }
            - { name: STUB_TOKENS_PER_SEC, value: '40' }
            - { name: STUB_SITE_PAGES, value: '300' }
          resources:
            # ~200 streams in flight at 1,500 users; below this the stub adds latency itself.
            requests: { cpu: '2', memory: 512Mi }
            limits: { cpu: '4', memory: 2Gi }
          readinessProbe:
            httpGet: { path: /v1/models, port: llm }
---
apiVersion: v1
kind: Service
metadata:
  name: loadtest-stubs
spec:
  selector: { app: loadtest-stubs }
  ports:
    - { name: llm, port: 8979, targetPort: llm }
    - { name: site, port: 8980, targetPort: site }
