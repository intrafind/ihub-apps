# One pod per shard; together they produce the profile's VU totals.
# Keep `completions`/`parallelism` equal to LT_SHARD_COUNT (k8s/run.sh sets all three).
#   kubectl -n ihub-loadtest apply -f tests/load/k8s/run-job.yaml
#   kubectl -n ihub-loadtest logs -f -l job-name=loadtest-run --max-log-requests 20 | grep -v '##LT-RESULT##'
#   tests/load/k8s/collect.sh            # copies the shard files, merges them into a report
apiVersion: batch/v1
kind: Job
metadata:
  name: loadtest-run
spec:
  completionMode: Indexed
  completions: 8
  parallelism: 8
  backoffLimit: 0
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels: { app: loadtest-run }
    spec:
      restartPolicy: Never
      # Spread shards over nodes so a runner is never the bottleneck.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: loadtest-run }
      # A dedicated node pool (example): keep runners off the node iHub runs on.
      # nodeSelector: { nodepool: loadtest }
      # tolerations: [{ key: dedicated, operator: Equal, value: loadtest, effect: NoSchedule }]
      # The runner talks to iHub over HTTP only; it needs no Kubernetes API access.
      automountServiceAccountToken: false
      # The image runs as `node` (uid/gid 1000, tests/load/Dockerfile).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: runner
          image: ghcr.io/intrafind/ihub-apps:loadtest-runner # tests/load/Dockerfile
          # Run, then stay up for an hour so collect.sh can `kubectl cp` the shard file:
          # `kubectl logs` splits very long lines, which corrupts the ##LT-RESULT## chunks.
          # DONE marks the end of the run (also after a failed one).
          command: ['sh', '-c', 'node run.mjs; touch /loadtest/results/DONE; sleep 3600']
          envFrom:
            - configMapRef: { name: loadtest-config }
            - secretRef: { name: loadtest-secrets }
            # Per-run overrides written by k8s/run.sh (LT_RUN_ID, LT_STAGES, …); last one wins.
            # Applying this file by hand after run.sh: `kubectl delete configmap loadtest-run-overrides`.
            - configMapRef: { name: loadtest-run-overrides, optional: true }
          # JOB_COMPLETION_INDEX (set by Kubernetes) is the shard index.
          resources:
            requests: { cpu: '1', memory: 1Gi, ephemeral-storage: 128Mi }
            limits: { cpu: '2', memory: 2Gi, ephemeral-storage: 1Gi }
          # The runner writes only its shard files, to the results directory.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: results, mountPath: /loadtest/results }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: results
          emptyDir: { sizeLimit: 512Mi }
        - name: tmp
          emptyDir: { sizeLimit: 128Mi }
