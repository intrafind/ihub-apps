# kubectl -n ihub-loadtest apply -f tests/load/k8s/setup-job.yaml && kubectl -n ihub-loadtest logs -f job/loadtest-setup
apiVersion: batch/v1
kind: Job
metadata:
  name: loadtest-setup
  namespace: ihub-loadtest
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      # The runner talks to iHub over HTTP only; it needs no Kubernetes API access.
      automountServiceAccountToken: false
      containers:
        - name: setup
          image: ghcr.io/intrafind/ihub-apps:loadtest-runner # tests/load/Dockerfile
          args: ['setup.mjs']
          envFrom:
            - configMapRef: { name: loadtest-config }
            - secretRef: { name: loadtest-secrets }
            # Per-call overrides written by k8s/setup.sh (LT_USER_COUNT, LT_LLM_URL, …).
            - configMapRef: { name: loadtest-run-overrides, optional: true }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: '1', memory: 1Gi }
