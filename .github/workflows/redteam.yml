# LLM red team (promptfoo), nightly
#
# The deterministic prompt-injection suite (tests/security/injection/, on every PR)
# assumes the model obeys every planted instruction and proves what the platform still
# prevents. This run measures the other half: whether a real model obeys them at all,
# and whether anything gets through when it does.
#
# tests/security/redteam/start-target.mjs starts iHub with the injection suite's
# poisoned contents and an Anthropic model; promptfoo asks ordinary questions as a
# regular user through the OpenAI-compatible API and grades what the attack achieved
# (requests to the attacker's canary, markup that would load from another host,
# restricted secrets in the answer, plus a model-graded rubric). Every test runs three
# times; any failure fails the run. Results: job summary and the redteam-report artifact.
#
# Needs the secret ANTHROPIC_API_KEY (target and grader); skipped without it. The
# repository variable REDTEAM_MODEL picks the model under test (default
# claude-haiku-5-5). Calls go to the Anthropic API only; promptfoo's telemetry,
# sharing and remote generation are off.

name: Red team

on:
  schedule:
    - cron: '13 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redteam-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promptfoo:
    name: Prompt injection (real model)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      PROMPTFOO_VERSION: 0.126.0
      PROMPTFOO_DISABLE_TELEMETRY: '1'
      PROMPTFOO_DISABLE_SHARING: '1'
      PROMPTFOO_DISABLE_REMOTE_GENERATION: 'true'
      PROMPTFOO_DISABLE_UPDATE: '1'
    steps:
      - name: Skip without a model key
        if: env.HAS_KEY != 'true'
        run: echo "::notice::ANTHROPIC_API_KEY is not set; the red team is skipped."

      - name: Checkout repository
        if: env.HAS_KEY == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: env.HAS_KEY == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        if: env.HAS_KEY == 'true'
        run: npm run install:all

      - name: Start iHub with the poisoned contents
        if: env.HAS_KEY == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REDTEAM_MODEL: ${{ vars.REDTEAM_MODEL }}
        run: |
          nohup node tests/security/redteam/start-target.mjs > "$RUNNER_TEMP/ihub.log" 2>&1 &
          for _ in $(seq 1 90); do
            if curl -sf http://127.0.0.1:3401/api/health > /dev/null; then echo "iHub is up"; exit 0; fi
            sleep 2
          done
          echo "iHub did not start"; cat "$RUNNER_TEMP/ihub.log"; exit 1

      - name: Sign in as a regular user
        if: env.HAS_KEY == 'true'
        run: |
          token="$(curl -sS -D - -o /dev/null -H 'Content-Type: application/json' \
            -d '{"username":"bob","password":"bob-password-123"}' \
            http://127.0.0.1:3401/api/auth/local/login | tr -d '\r' | sed -n 's/^[Ss]et-[Cc]ookie: authToken=\([^;]*\).*/\1/p' | head -1)"
          if [ -z "$token" ]; then echo "Sign-in failed"; tail -50 "$RUNNER_TEMP/ihub.log"; exit 1; fi
          echo "::add-mask::$token"
          echo "IHUB_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Run the red team
        if: env.HAS_KEY == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p redteam-report
          npx --yes "promptfoo@${PROMPTFOO_VERSION}" eval \
            -c tests/security/redteam/promptfooconfig.yaml \
            -o redteam-report/results.json -o redteam-report/report.html \
            --no-cache --no-progress-bar

      - name: Summarize
        if: always() && env.HAS_KEY == 'true'
        run: |
          file=redteam-report/results.json
          [ -s "$file" ] || { echo "No results." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          {
            echo "## Red team"
            echo
            echo "| Test | Passed | Failure reasons |"
            echo "| --- | --- | --- |"
            jq -r '
              .results.results
              | group_by(.testCase.description)[]
              | [ .[0].testCase.description,
                  "\(map(select(.success)) | length)/\(length)",
                  (map(select(.success | not) | (.gradingResult.reason // .error // "") | gsub("[|\r\n]"; " ") | .[0:200]) | unique | join("<br>")) ]
              | "| \(.[0]) | \(.[1]) | \(.[2]) |"' "$file"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report and the server log
        if: always() && env.HAS_KEY == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: redteam-report
          path: |
            redteam-report/
            ${{ runner.temp }}/ihub.log
          retention-days: 30
