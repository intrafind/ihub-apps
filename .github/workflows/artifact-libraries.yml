# Library kit for HTML artifacts (#3822)
#
# The browser libraries in server/artifactLibraries/ are copies of files from
# npm packages. This check downloads each package at the version the manifest
# (shared/artifactLibraries.js) pins and fails when a vendored file, its size
# or its SHA-256 differs from the published one.

name: Artifact libraries

on:
  pull_request:
    paths:
      - 'server/artifactLibraries/**'
      - 'shared/artifactLibraries.js'
      - 'scripts/check-artifact-libraries.js'
      - '.github/workflows/artifact-libraries.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Vendored files match npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Compare with npm
        run: node scripts/check-artifact-libraries.js
