# Route crawl
#
# Signs in as the default admin on a fresh install and follows every in-app link
# (breadth first, up to 120 pages), failing on a failed API call, an uncaught
# exception or a console error (tests/e2e/route-crawl.spec.js).
#
# It catches what a server refactor leaves in a client — a renamed route, a changed
# response shape, a wrong base path — which no unit test sees until the page is
# opened. scripts/check-client-api-contract.js covers the same ground statically;
# this runs the real pages.
#
# The crawl runs alone (the other specs create and delete data while they run, which
# is not what a crawl should read) and without retries: a retry would hide the
# flakiness it is there to surface.
#
# There is deliberately no `paths:` filter, for the reason given in
# api-guidelines-check.yml: a required check that a PR never triggers would block it.

name: Route crawl

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: route-crawl-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  route-crawl:
    name: Route crawl
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CI: 'true'
      # Required by the server to boot in CI.
      JWT_SECRET: ci-route-crawl-test-secret
      NODE_ENV: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm run install:all

      - name: Install Playwright browsers
        # --no-install: use the Playwright version pinned by the lockfile, never fetch one on demand.
        run: npx --no-install playwright install --with-deps chromium

      - name: Crawl the app
        # The Playwright config starts the app on its own contents directory first
        # (tests/config/e2e-server.mjs).
        run: npm run test:e2e:crawl -- --project=chromium --retries=0

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: route-crawl-playwright-report
          path: playwright-report/
          retention-days: 14
