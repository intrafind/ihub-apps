name: Build Nextcloud Plugin

# Produces the `ihub_chat.tar.gz` archive that Nextcloud admins install into
# `custom_apps/`. Builds for:
#   - every push to main / PR that touches the plugin source (uploaded as a
#     workflow artifact, retained 30 days — useful for testing pre-release
#     builds)
#   - every published GitHub Release (attached to the release as a download
#     asset — the canonical "production install" source)
#   - manual workflow_dispatch (rebuild on demand against any branch)
#
# Install instructions for admins live in docs/nextcloud-embed.md.

on:
  push:
    branches: [main]
    paths:
      - 'nextcloud-app/**'
      - '.github/workflows/build-nextcloud-plugin.yml'
  pull_request:
    paths:
      - 'nextcloud-app/**'
      - '.github/workflows/build-nextcloud-plugin.yml'
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    name: Build & publish plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required for softprops/action-gh-release on release events
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '24'
          # No npm cache: this job publishes release assets (zizmor cache-poisoning).

      - name: Install dependencies
        working-directory: nextcloud-app
        run: npm ci

      - name: Build plugin tarball
        working-directory: nextcloud-app
        run: make package

      - name: Show archive contents (sanity check)
        run: |
          ls -lh ihub_chat.tar.gz
          tar -tzf ihub_chat.tar.gz | head -20
          # Fail loudly if the archive doesn't have the expected top-level
          # directory — Nextcloud would otherwise refuse to load it.
          if ! tar -tzf ihub_chat.tar.gz | head -1 | grep -q '^ihub_chat/'; then
            echo "::error::Tarball top-level entry must be ihub_chat/"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ihub_chat-${{ github.sha }}
          path: ihub_chat.tar.gz
          retention-days: 30
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release' && github.event.release.tag_name != ''
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ihub_chat.tar.gz
          fail_on_unmatched_files: true

  attest:
    name: Attest release tarball
    needs: build
    # A separate job, so runs for pull requests never get signing permissions.
    if: github.event_name == 'release' && github.event.release.tag_name != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download plugin tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ihub_chat-${{ github.sha }}

      # Signed SLSA build provenance, verifiable with
      # `gh attestation verify ihub_chat.tar.gz --repo ${{ github.repository }}`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ihub_chat.tar.gz
