# EU AI Act marking (issue #2563): C2PA smoke test on every OS the iHub
# binary ships for, and the nightly marking robustness benchmark.
name: AI Provenance

on:
  pull_request:
    paths:
      - 'server/services/provenance/**'
      - 'server/package.json'
      - 'server/package-lock.json'
      - 'scripts/c2pa-smoke.mjs'
      - '.github/workflows/ai-provenance.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c2pa-smoke:
    name: C2PA smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        working-directory: server
        # Lifecycle scripts stay off; only c2pa-node's postinstall runs, which
        # downloads its prebuilt native binary.
        run: |
          npm ci --omit=dev --ignore-scripts
          npm rebuild @contentauth/c2pa-node
      - name: Cache TrustMark models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/trustmark-models
          key: trustmark-models-P-v1
      - name: Sign and verify
        run: node scripts/c2pa-smoke.mjs

  marking-benchmark:
    name: Marking robustness benchmark
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm run install:all
      - name: Run the full benchmark
        run: npm run test:marking-benchmark -- --full --out marking-benchmark.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marking-benchmark
          path: marking-benchmark.json
