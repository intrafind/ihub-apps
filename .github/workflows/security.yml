# Security checks on pull requests and pushes to main.
#
# - Dependency review: fails a PR that adds a dependency with a high/critical
#   advisory or a license outside .github/dependency-review-config.yml. Only
#   the dependencies the PR changes are checked, so the existing backlog does
#   not block unrelated work (that backlog is tracked by dependency-scan.yml).
# - Secret scan: gitleaks over the commits the PR (or push) adds, using
#   .gitleaks.toml. Pair with GitHub push protection, which runs server-side.
# - Admin route audit: every route under server/routes/admin must be guarded
#   by adminAuth or contentAdminAuth (scripts/audit-admin-endpoints.js).
#
# See docs/security.md#automated-security-checks.

name: Security

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz from the
      # release's checksums.txt. Update both together.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan new commits for secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request) range="${PR_BASE}..${PR_HEAD}" ;;
            push)
              # A new branch has no "before" commit; scan just the pushed head.
              if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
                range="-1 ${PUSH_AFTER}"
              else
                range="${PUSH_BEFORE}..${PUSH_AFTER}"
              fi
              ;;
            *) range="-1 HEAD" ;;
          esac
          echo "Scanning commits: $range"
          "$RUNNER_TEMP/gitleaks" git . \
            --log-opts="$range" \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --verbose \
            --exit-code 1 || {
            {
              echo "### Secret scan failed"
              echo
              echo "gitleaks found a possible secret in the commits above (values are redacted in the log)."
              echo
              echo "- **Real secret:** rotate it now. Deleting it from the branch does not remove it from git history."
              echo "- **False positive:** add a \`gitleaks:allow\` comment on that line, or a pattern to \`.gitleaks.toml\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

  admin-route-audit:
    name: Admin route audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Check every admin route has an admin guard
        run: npm run security:audit
