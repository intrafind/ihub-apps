# Response shapes
#
# Starts the server on a seeded contents directory, requests every readable GET route
# as the default admin and compares the shape of each answer (keys and types, never
# values) with tests/contract/response-shapes.json (scripts/check-response-shapes.js).
#
# A pull request that renames or moves a key in an API answer fails here until the
# snapshot is updated (`node scripts/check-response-shapes.js --update`), which puts the
# change in the diff for review and is the moment to look at the clients that read it.
#
# There is deliberately no `paths:` filter, for the reason given in
# api-guidelines-check.yml: a required check that a PR never triggers would block it.

name: Response shapes

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: response-shapes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  response-shapes:
    name: Response shapes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: 'true'
      JWT_SECRET: ci-response-shapes-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm run install:all

      - name: Compare the answers with the snapshot
        run: npm run check:response-shapes
