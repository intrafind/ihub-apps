name: Build mdBook Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/update-docs-version.js'
      - 'scripts/export-docs-markdown.js'
      - 'server/utils/releaseNotes.js'
  workflow_dispatch:

jobs:
  build-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08 # v2.0.0
        with:
          mdbook-version: 'latest'

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Cargo binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-mdbook-${{ hashFiles('**/book.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mdbook-

      - name: Install mdBook backends
        run: |
          # Check if already cached, install if not
          # if ! command -v mdbook-pdf &> /dev/null; then
          #   echo "Installing mdbook-pdf..."
          #   cargo install mdbook-pdf
          # else
          #   echo "mdbook-pdf already installed"
          # fi

          if ! command -v mdbook-mermaid &> /dev/null; then
            echo "Installing mdbook-mermaid..."
            cargo install mdbook-mermaid
          else
            echo "mdbook-mermaid already installed"
          fi

      # - name: Install Chromium (for PDF generation)
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y chromium-browser
      #     chromium-browser --version

      - name: Install NPM dependencies
        run: npm ci

      - name: Build all documentation formats
        run: npm run docs:build:all
        env:
          RUST_BACKTRACE: 1

      - name: Verify outputs
        run: |
          echo "=== Build Outputs ==="
          ls -lh docs/book/
          echo ""
          echo "=== HTML Output ==="
          ls -lh docs/book/html/ | head -10
          echo ""
          echo "=== PDF Output ==="
          ls -lh docs/book/pdf/ || echo "No PDF output"
          echo ""
          echo "=== Markdown Output ==="
          ls -lh docs/book/*.md || echo "No Markdown output"

      - name: Upload HTML artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-html
          path: docs/book/html

      - name: Upload PDF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-pdf
          path: docs/book/pdf/*.pdf
        continue-on-error: true

      - name: Upload Markdown artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-markdown
          path: docs/book/iHub-Apps-Documentation.md
        continue-on-error: true
