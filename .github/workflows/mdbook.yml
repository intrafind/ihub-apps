name: Build mdBook Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/update-docs-version.js'
      - 'scripts/export-docs-markdown.js'
      - 'server/utils/releaseNotes.js'
  workflow_dispatch:

jobs:
  build-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup mdBook and Rust
        uses: ./.github/actions/setup-mdbook-rust

      # - name: Install Chromium (for PDF generation)
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y chromium-browser
      #     chromium-browser --version

      - name: Install NPM dependencies
        run: npm ci --ignore-scripts

      - name: Build all documentation formats
        run: npm run docs:build:all
        env:
          RUST_BACKTRACE: 1

      - name: Verify outputs
        run: |
          echo "=== Build Outputs ==="
          ls -lh docs/book/
          echo ""
          echo "=== HTML Output ==="
          ls -lh docs/book/html/ | head -10
          echo ""
          echo "=== PDF Output ==="
          ls -lh docs/book/pdf/ || echo "No PDF output"
          echo ""
          echo "=== Markdown Output ==="
          ls -lh docs/book/*.md || echo "No Markdown output"

      # mdBook writes to book/html/ when more than one renderer is configured, to book/ otherwise.
      - name: Locate HTML output
        id: html
        run: |
          if [ -d docs/book/html ]; then echo "path=docs/book/html" >> "$GITHUB_OUTPUT"; else echo "path=docs/book" >> "$GITHUB_OUTPUT"; fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.html.outputs.path }}

      - name: Upload HTML artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-html
          path: ${{ steps.html.outputs.path }}

      - name: Upload PDF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-pdf
          path: docs/book/pdf/*.pdf
        continue-on-error: true

      - name: Upload Markdown artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-markdown
          path: docs/book/iHub-Apps-Documentation.md
        continue-on-error: true

  # Publishes the documentation site to GitHub Pages (Settings → Pages → Source: GitHub Actions).
  deploy-pages:
    needs: build-docs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One Pages deployment at a time. Only deploy jobs join the group, so a docs build on another
    # branch can never replace a queued deployment from main.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
