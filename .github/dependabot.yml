# Dependabot version updates. Security updates are configured in the repository
# settings and ignore the cooldowns below.
#
# Cooldowns hold back a new release for a week (two for majors): hijacked
# package versions are usually caught and pulled within days.
#
# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: 'npm' # See documentation for possible values
    directory: '/' # Location of package manifests
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      all-patches:
        update-types:
          - "patch"
      all-minors:
        update-types:
          - "minor"

  - package-ecosystem: 'npm'
    directory: '/client'
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      all-patches:
        update-types:
          - "patch"
      all-minors:
        update-types:
          - "minor"

  - package-ecosystem: 'npm'
    directory: '/server'
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      all-patches:
        update-types:
          - "patch"
      all-minors:
        update-types:
          - "minor"

  - package-ecosystem: 'npm'
    directory: '/nextcloud-app'
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      all-patches:
        update-types:
          - "patch"
      all-minors:
        update-types:
          - "minor"

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
    groups:
      all-patches:
        update-types:
          - "patch"
      all-minors:
        update-types:
          - "minor"
